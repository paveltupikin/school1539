<meta name="description" content="Школа 1539 · демонстрационный тренажёр по ОГЭ и ЕГЭ.">
<title>Школа 1539 · ОГЭ и ЕГЭ</title>
<style>
:root{--paper:#f0eee5;--ink:#161717;--blue:#2542f5;--lime:#d4ff39;--pink:#f0a6d0;--white:#fffef8;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}main{flex:1}button,input,select,textarea{font:inherit}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a52976;outline-offset:3px}.skip{position:fixed;top:8px;left:8px;background:var(--lime);padding:10px;z-index:10;transform:translateY(-150%)}.skip:focus{transform:none}
.wrap{width:min(1200px,calc(100% - 56px));margin-inline:auto}.narrow{max-width:860px}.nav{display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:70px}.nav nav,.actions,.tabs,.facts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.nav a,.button,.tabs a,.subject-card{text-decoration:none}.nav nav a{font-weight:700;padding:6px}.nav nav [aria-current]{border-bottom:2px solid var(--blue)}.brand{font-weight:900;white-space:nowrap}.brand i{display:inline-grid;place-items:center;background:var(--blue);color:white;width:26px;height:26px;font-style:normal;margin-right:5px}
.button,.tabs a{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:10px 16px;border:1px solid var(--ink);background:var(--lime);color:var(--ink);font-weight:800;cursor:pointer}.button:hover,.tabs a:hover{filter:brightness(.94)}.button:disabled{opacity:.55;cursor:wait}.button.paper{background:var(--paper)}.button.outline,.tabs a{background:transparent}.tabs [aria-current]{background:var(--blue);color:white;border-color:var(--blue)}
.hero{background:var(--blue);color:var(--paper);overflow:hidden}.hero .wrap{position:relative;padding-block:22px 52px}.hero-label{border-bottom:1px solid currentColor;display:flex;justify-content:space-between;gap:15px;padding-bottom:14px;font-size:13px;font-weight:800}.hero-copy{position:relative;z-index:1}.hero h1{margin:36px 0 20px;max-width:820px;font-size:clamp(3.4rem,9.1vw,8.1rem);line-height:.88;letter-spacing:-.082em;text-transform:uppercase;font-weight:900}.hero em{font-style:normal;color:var(--lime)}.hero p{font-size:clamp(1rem,2vw,1.23rem);margin:23px 0}.orbit{color:var(--lime);position:absolute;right:0;top:48px;width:37%;height:auto;pointer-events:none}.strip{background:var(--lime);border-block:1px solid var(--ink)}.facts{justify-content:space-between;min-height:59px;padding-block:11px}
.section{padding-block:34px 48px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}.section-head h2,.intro h1{margin:0;font-size:clamp(2.2rem,5.5vw,4.8rem);letter-spacing:-.065em;line-height:1;text-transform:uppercase}.section-head h2{font-size:clamp(1.75rem,4vw,3.2rem)}.intro{margin:0 0 24px}.intro p:last-child{margin-bottom:0}.eyebrow{font-size:.79rem;letter-spacing:.06em;font-weight:900}.intro .eyebrow{color:var(--blue)}.back{display:inline-block;margin-bottom:22px;font-weight:700}.subject-grid,.format-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.format-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.subject-card,.subject-banner,.panel{border:1px solid var(--ink);padding:20px;min-width:0}.subject-card{min-height:190px;position:relative;padding-bottom:34px}.subject-card:hover{box-shadow:4px 4px 0 var(--blue)}.subject-card h3{margin:0;font-size:clamp(1.1rem,2vw,1.55rem);letter-spacing:-.045em}.subject-card p{margin:7px 0;font-size:.9rem}.mark{display:block;font-weight:900;font-size:clamp(2rem,5vw,4.5rem);color:var(--blue);line-height:1}.subject-card .mark{border-bottom:1px solid currentColor;padding-bottom:11px;margin-bottom:12px}.arrow{position:absolute;bottom:10px;right:13px;font-weight:900}.russ{background:var(--ink);color:var(--paper)}.russ .mark{color:var(--lime)}.history{background:var(--pink)}.social{background:var(--lime)}.subject-banner{display:grid;gap:20px;padding:clamp(18px,4vw,48px);margin-bottom:15px;grid-template-areas:"title mark" "topics mark";grid-template-columns:1fr auto;align-items:center}.subject-banner h1{margin:0;font-size:clamp(2rem,7vw,6rem);line-height:.98;letter-spacing:-.07em;overflow-wrap:anywhere}.subject-banner p{margin:9px 0}.subject-title{grid-area:title}.subject-banner .mark{grid-area:mark;text-align:center;font-size:clamp(2.5rem,8vw,8rem)}.topics{grid-area:topics;display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}.topics li{border:1px solid;padding:6px 8px;font-size:.84rem;font-weight:700}.subject-banner.russ{grid-template-areas:"mark title" "mark topics";grid-template-columns:minmax(100px,1fr) 2fr}.subject-banner.history{grid-template-areas:"title" "mark" "topics";grid-template-columns:1fr}.subject-banner.history .mark{border-bottom:2px solid;text-align:left;letter-spacing:.6em}.subject-banner.social{grid-template-areas:"title topics" "mark topics";grid-template-columns:2fr 1fr}.subject-banner.social .mark{text-align:left}.subject-banner.social .topics{flex-direction:column}
.panel{background:var(--white);padding:clamp(16px,3vw,30px)}.panel h2,.panel h3{margin:0 0 12px}.panel p{line-height:1.45}.panel form,.panel label,.form-fields{display:grid;gap:9px}.panel label{font-weight:700;margin:10px 0;gap:5px}.panel input,.panel select{width:100%;background:white;color:var(--ink);border:1px solid var(--ink);min-height:42px;padding:8px}.panel form .button{justify-self:start}.notice:empty{display:none}.notice{font-weight:700;color:#9b234d}.question{border-top:1px solid var(--ink);padding-block:12px;margin-top:10px}.timer{font-size:1.3rem;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}.stack{display:grid;gap:14px}.teacher-grid{display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr);gap:14px;align-items:start}.group-list{display:grid;gap:8px;margin:12px 0}.group-list [aria-current]{font-weight:900}.group-banner{background:var(--blue);color:white;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:22px}.group-banner h2,.group-banner p{margin:4px 0}.form-fields{grid-template-columns:repeat(3,minmax(0,1fr))}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{text-align:left;padding:10px;border-bottom:1px solid #a7a39a;vertical-align:top}th{background:var(--paper)}[hidden]{display:none!important}footer{background:var(--ink);color:var(--paper)}footer b{color:var(--lime)}
@media(max-width:900px){.orbit{top:75px;width:32%;opacity:.75}.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.wrap{width:calc(100% - 30px)}.nav{gap:9px;flex-wrap:wrap;padding-block:10px}.nav nav{order:3;width:100%;gap:11px}.hero .wrap{padding-bottom:36px}.hero h1{font-size:clamp(2.75rem,10vw,4.6rem)}.hero-label{font-size:.66rem}.hero p{max-width:260px}.orbit{top:auto;bottom:26px;right:-45px;width:47%;opacity:.52}.facts{font-size:.73rem;gap:7px}.format-grid,.teacher-grid,.form-fields{grid-template-columns:1fr}.subject-banner,.subject-banner.russ,.subject-banner.social{grid-template-areas:"title" "mark" "topics";grid-template-columns:1fr}.subject-banner .mark{text-align:left}.subject-card{padding:12px 10px 30px;min-height:150px}.subject-card h3{overflow-wrap:anywhere}.subject-card p{font-size:.8rem}}

.subject-banner .subject-title {min-width:0} .section-head span {font-weight:900;color:var(--blue)}
</style>
</head>
<body>
<a class="skip" href="#main">К содержанию</a>
<header><div class="wrap nav">
  <a class="brand" href="#"><i aria-hidden="true">↗</i> ШКОЛА 1539</a>
  <nav aria-label="Основная навигация">
    <a href="#/oge">ОГЭ</a><a href="#/ege">ЕГЭ</a><a href="#/progress">Мой прогресс</a>
  </nav>
  <a class="button outline" href="#/oge/math/quiz">Попробовать ↗</a>
</div></header>
<main id="main" tabindex="-1">
  <noscript><p class="wrap section">Для тренажёра включите JavaScript в браузере.</p></noscript>
</main>
<footer><div class="wrap nav"><b>ШКОЛА 1539</b><span>Демо · результаты на этом устройстве</span></div></footer>
<script>
const BANK = {
  "oge/math": [
    [
      "Уравнения",
      "Решите 3x − 7 = 11.",
      "6"
    ],
    [
      "Проценты",
      "Найдите 15% от 240.",
      "36"
    ],
    [
      "Геометрия",
      "Найдите площадь треугольника с основанием 12 и высотой 5.",
      "30"
    ]
  ],
  "ege/math": [
    [
      "Производная",
      "Найдите производную x³ в точке x = 2.",
      "12"
    ],
    [
      "Логарифмы",
      "Вычислите log₂ 32.",
      "5"
    ],
    [
      "Вероятность",
      "Монету бросили дважды. Укажите вероятность двух орлов десятичной дробью.",
      "0,25"
    ]
  ],
  "oge/russ": [
    [
      "Орфография",
      "Вставьте букву: р_стение.",
      "а"
    ],
    [
      "Морфология",
      "Назовите часть речи слова «быстро» в предложении «Он быстро бежал».",
      "наречие"
    ],
    [
      "Синтаксис",
      "Укажите подлежащее: «На дереве сидела ворона».",
      "ворона"
    ]
  ],
  "ege/russ": [
    [
      "Орфография",
      "Вставьте букву в пр_клеить и запишите целое слово.",
      "приклеить"
    ],
    [
      "Грамматика",
      "Исправьте сочетание «более красивее».",
      "более красивый"
    ],
    [
      "Лексика",
      "Как называются слова с противоположным значением?",
      "антонимы"
    ]
  ],
  "oge/history": [
    [
      "Даты",
      "В каком году произошло Крещение Руси?",
      "988"
    ],
    [
      "Личности",
      "Укажите фамилию первого космонавта.",
      "Гагарин"
    ],
    [
      "Термины",
      "Как называлось народное собрание в Древней Руси?",
      "вече"
    ]
  ],
  "ege/history": [
    [
      "Даты",
      "В каком году отменили крепостное право в Российской империи?",
      "1861"
    ],
    [
      "Личности",
      "Укажите фамилию председателя Совета министров, с которым связана аграрная реформа 1906 года.",
      "Столыпин"
    ],
    [
      "Термины",
      "Как называлась политика 1920-х, при которой допускалась частная торговля? Ответьте аббревиатурой.",
      "НЭП"
    ]
  ],
  "oge/social": [
    [
      "Экономика",
      "Как называется устойчивый рост общего уровня цен?",
      "инфляция"
    ],
    [
      "Политика",
      "Как называется основной закон государства?",
      "конституция"
    ],
    [
      "Экономика",
      "Как называется вознаграждение за труд наёмного работника? Ответьте двумя словами.",
      "заработная плата"
    ]
  ],
  "ege/social": [
    [
      "Экономика",
      "Как называется ситуация, когда на рынке только один продавец товара без близких заменителей?",
      "монополия"
    ],
    [
      "Политика",
      "Назовите форму государственного устройства России одним словом.",
      "федерация"
    ],
    [
      "Право",
      "Как называется способность лица своими действиями приобретать и осуществлять гражданские права?",
      "дееспособность"
    ]
  ]
};
"use strict";

const exams = {oge: "ОГЭ", ege: "ЕГЭ"};
const subjects = {
  math: ["Математика", "∑ × ÷", "Формулы, графики, вероятность"],
  russ: ["Русский язык", "Аа Бб", "Орфография, грамматика, синтаксис"],
  history: ["История", "← · →", "Даты, личности, события"],
  social: ["Обществознание", "○ ◉ ○", "Право, экономика, политика"],
};
const storageKey = "school1539-pages-demo-v1";
const main = document.querySelector("main");
let progress = {};
let storageAvailable = true;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
  if (saved && typeof saved === "object" && !Array.isArray(saved)) progress = saved;
} catch {
  storageAvailable = false;
}

const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
})[c]);
const button = (href, label, theme = "") => `<a class="button ${theme}" href="${href}">${label}</a>`;
const layout = (content, narrow = false) => `<div class="wrap section ${narrow ? "narrow" : ""}">${content}</div>`;
const title = (kicker, heading) => `<div class="intro"><p class="eyebrow">${kicker}</p><h1>${heading}</h1></div>`;
const normalize = value => value.trim().toLowerCase().replaceAll("ё", "е").replaceAll(",", ".").replace(/\s+/g, " ");

function stat(key) {
  const row = progress[key] || {};
  const count = name => Number.isSafeInteger(row[name]) && row[name] >= 0 ? row[name] : 0;
  return {answered: count("answered"), correct: count("correct"), cards: count("cards"), tests: count("tests")};
}

function record(key, mode, correct, total) {
  const current = stat(key);
  current.answered += total;
  current.correct += correct;
  if (mode === "quiz") current.cards += 1;
  else current.tests += 1;
  progress[key] = current;
  try {
    localStorage.setItem(storageKey, JSON.stringify(progress));
  } catch {
    storageAvailable = false;
  }
}

function catalog(exam) {
  const selected = exam || "oge";
  const curves = Array.from({length: 12}, (_, i) => `<path d="M6 ${24 + i * 7} C135 ${-14 + i * 10}, 108 ${270 - i * 8}, 395 ${22 + i * 12}"/>`).join("");
  main.innerHTML = `<section class="hero"><div class="wrap">
    <div class="hero-label"><span>ШКОЛЬНЫЙ ПОРТАЛ</span><span>ОГЭ И ЕГЭ · 9–11 КЛАССЫ</span></div>
    <div class="hero-copy">
      <h1>${exam ? `Подготовка<br>к <em>${exams[exam]}</em>` : "Готовься<br><em>к экзаменам</em>"}</h1>
      <p>Карточки с мгновенной проверкой и короткие пробники.</p>
      <div class="actions">${button("#/oge", "Выбрать ОГЭ ↗")}${button("#/ege", "Выбрать ЕГЭ ↗", "paper")}</div>
    </div>
    <svg class="orbit" viewBox="0 0 412 258" aria-hidden="true"><g fill="none" stroke="currentColor">${curves}</g>
      <circle cx="278" cy="146" r="30" fill="#f0eee5"/><circle cx="350" cy="80" r="8" fill="#f0a6d0"/><circle cx="65" cy="214" r="12" fill="currentColor"/>
    </svg>
  </div></section>
  <div class="strip"><div class="wrap facts"><b>9–11 КЛАССЫ</b><b>4 ПРЕДМЕТА</b><b>2 ФОРМАТА ТРЕНИРОВКИ</b></div></div>
  <section class="wrap section" aria-labelledby="subjects">
    <div class="section-head"><h2 id="subjects">Выбери предмет</h2><span>${exams[selected]}</span></div>
    <div class="subject-grid">${Object.entries(subjects).map(([id, [name, mark, note]]) =>
      `<a class="subject-card ${id}" href="#/${selected}/${id}"><span class="mark" aria-hidden="true">${mark}</span>
      <h3>${name}</h3><p>${note}</p><span class="arrow" aria-hidden="true">↗</span></a>`).join("")}</div>
  </section>`;
}

function subjectPage(exam, id) {
  const [name, mark, note] = subjects[id];
  const base = `#/${exam}/${id}`;
  main.innerHTML = layout(`<a class="back" href="#/${exam}">← Все предметы · ${exams[exam]}</a>
    <section class="subject-banner ${id}"><div class="subject-title"><p class="eyebrow">${exams[exam]} / ПОДГОТОВКА</p>
    <h1>${name}</h1><p>${note}</p></div><div class="mark" aria-hidden="true">${mark}</div></section>
    <div class="format-grid">
      <article class="panel"><h2>Карточки</h2><p>Проверка после каждого ответа. Вопросы повторяются по кругу.</p>${button(base + "/quiz", "Открыть карточки ↗")}</article>
      <article class="panel"><h2>Мини-пробник</h2><p>Три задания с общей проверкой в конце.</p>${button(base + "/test", "Открыть пробник ↗")}</article>
    </div>`);
}

function training(exam, id, mode) {
  const key = exam + "/" + id;
  const quiz = mode === "quiz";
  const bank = BANK[key];
  const questions = quiz ? [bank[stat(key).cards % bank.length]] : bank;
  const render = content => {
    main.innerHTML = layout(`<a class="back" href="#/${key}">← ${subjects[id][0]}</a>`
      + title(`${exams[exam]} / ${subjects[id][0]}`, quiz ? "Карточка" : "Мини-пробник") + content, true);
  };
  render(`<form class="panel" id="answers">
    ${questions.map(([topic, question], i) => `<div class="question"><p class="eyebrow">${i + 1} / ${escapeHTML(topic)}</p>
    <label>${escapeHTML(question)}<input name="q${i}" maxlength="240" autocomplete="off" placeholder="Ваш ответ" ${quiz ? "required" : ""}></label></div>`).join("")}
    <button class="button" type="submit">${quiz ? "Проверить ответ" : "Сдать пробник"}</button>
  </form>`);
  document.querySelector("#answers").addEventListener("submit", event => {
    event.preventDefault();
    const form = new FormData(event.currentTarget);
    const results = questions.map(([, question, answer], i) => {
      const correct = normalize(form.get("q" + i) || "") === normalize(answer);
      return {question, answer, correct};
    });
    const correct = results.filter(result => result.correct).length;
    record(key, mode, correct, results.length);
    render(`<section class="panel stack"><h2 id="result" tabindex="-1">Верно: ${correct} из ${results.length}</h2>
      ${results.map(result => `<div class="question"><p>${escapeHTML(result.question)}</p>
      <strong>${result.correct ? "Верно" : "Правильный ответ"} · ${escapeHTML(result.answer)}</strong></div>`).join("")}
      <div class="actions"><button class="button" id="again">${quiz ? "Следующая карточка ↗" : "Повторить пробник ↗"}</button>
      ${button("#/progress", "Мой прогресс ↗", "outline")}</div></section>`);
    document.querySelector("#result").focus();
    document.querySelector("#again").addEventListener("click", () => {
      training(exam, id, mode);
      main.focus();
    });
  }, {once: true});
}

function progressPage() {
  const rows = Object.entries(BANK).map(([key]) => {
    const [exam, id] = key.split("/");
    const value = stat(key);
    return value.answered ? [exams[exam], subjects[id][0], value.answered, value.correct, value.tests] : null;
  }).filter(Boolean);
  main.innerHTML = layout(title("КАБИНЕТ УЧЕНИКА", "Мой прогресс") + `<section class="panel">
    <p>${storageAvailable ? "Результаты сохраняются в этом браузере." : "Постоянное сохранение в этом браузере недоступно."}</p>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr><th scope="col">Экзамен</th><th scope="col">Предмет</th>
    <th scope="col">Ответы</th><th scope="col">Верно</th><th scope="col">Пробники</th></tr></thead>
    <tbody>${rows.map(row => `<tr>${row.map(value => `<td>${escapeHTML(value)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
    : `<p>Результаты появятся после первого ответа.</p>${button("#/oge/math/quiz", "Начать тренировку ↗")}`}
    </section>`, true);
}

function route() {
  if (location.hash === "#main") return;
  const parts = location.hash.slice(1).split("/").filter(Boolean);
  const [exam, id, mode] = parts;
  document.querySelectorAll("header nav a").forEach(link => {
    if (link.hash === "#/" + exam) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });
  if (exam === "progress" && parts.length === 1) progressPage();
  else if (!parts.length) catalog();
  else if (Object.hasOwn(exams, exam) && parts.length === 1) catalog(exam);
  else if (Object.hasOwn(BANK, exam + "/" + id) && parts.length === 2) subjectPage(exam, id);
  else if (Object.hasOwn(BANK, exam + "/" + id) && parts.length === 3 && ["quiz", "test"].includes(mode)) training(exam, id, mode);
  else main.innerHTML = layout(title("ШКОЛА 1539", "Раздел не найден") + button("#", "На главную ↗"), true);
}

window.addEventListener("hashchange", () => {
  route();
  main.focus();
  window.scrollTo(0, 0);
});
route();
if (location.hash === "#main") catalog();
</script>
</body>
</html>
